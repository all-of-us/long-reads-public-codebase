# Fail if any tracked notebook still has output cells.
# To strip locally: python3 scripts/strip_notebook_outputs.py

name: Check notebook outputs

on:
  pull_request:
  push:

concurrency:
  group: check-notebook-outputs-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-notebook-outputs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify notebooks have no output cells
        run: python3 scripts/strip_notebook_outputs.py --check
