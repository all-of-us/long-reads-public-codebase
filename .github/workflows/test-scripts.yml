# Unit tests for repository maintenance scripts (for example, the Terra config export redaction).
# To run locally: python3 -m unittest discover -s scripts/tests

name: Test scripts

on:
  pull_request:
  push:

concurrency:
  group: test-scripts-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run tests
        run: python3 -m unittest discover -s scripts/tests -v
